# Backend Service address, including its port.
image:
  repository: idea-board-frontend
  tag: local
  pullPolicy: IfNotPresent
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
# Empty uses backend.<release namespace>.svc.cluster.local:8000.
backendUpstream: ""

service:
  type: ClusterIP
  annotations: {}
  loadBalancerClass: ""
