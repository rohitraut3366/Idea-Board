name: idea-board-backend

services:
  frontend:
    image: idea-board-frontend:local
    build: ./apps/frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: idea-board-backend:local
    build: ./apps/backend
    command: ["alembic", "upgrade", "head"]
    environment:
      IDEA_BOARD_DATABASE_URL: postgresql+psycopg://idea_board:idea_board_local@postgres:5432/idea_board
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: idea-board-backend:local
    build: ./apps/backend
    environment:
      IDEA_BOARD_DATABASE_URL: postgresql+psycopg://idea_board:idea_board_local@postgres:5432/idea_board
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: idea_board
      POSTGRES_USER: idea_board
      POSTGRES_PASSWORD: idea_board_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea_board -d idea_board"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
