[project]
name = "idea-board-deploy"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
