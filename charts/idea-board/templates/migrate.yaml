apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "idea-board.name" . }}-migrate
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: IDEA_BOARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.databaseSecretName must reference an existing database Secret" .Values.backend.databaseSecretName | quote }}
                  key: IDEA_BOARD_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
