# Backend Service address, including its port.
image:
  repository: idea-board-frontend
  tag: local
  pullPolicy: IfNotPresent
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
backendUpstream: backend:8000

service:
  type: ClusterIP
  annotations: {}
  loadBalancerClass: ""
