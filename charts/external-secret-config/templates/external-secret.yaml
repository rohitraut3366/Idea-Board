{{- if not (and .Values.provider .Values.dataFrom) }}
{{- fail "provider and dataFrom are required" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "external-secret-config.name" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    {{- toYaml .Values.provider | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "external-secret-config.name" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "external-secret-config.name" . }}
  target:
    name: {{ required "secretName is required" .Values.secretName }}
    creationPolicy: Owner
  dataFrom:
    {{- toYaml .Values.dataFrom | nindent 4 }}
