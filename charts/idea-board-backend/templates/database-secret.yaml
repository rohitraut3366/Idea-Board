{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idea-board-backend.databaseSecretName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  IDEA_BOARD_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s.%s.svc.cluster.local:5432/%s" .Values.postgres.username .Values.postgres.password (include "idea-board-postgres.name" .Subcharts.postgres) .Release.Namespace .Values.postgres.database | quote }}
{{- end }}
