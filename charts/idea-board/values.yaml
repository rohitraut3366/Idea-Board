backend:
  image:
    repository: idea-board-backend
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  # Existing Secret containing IDEA_BOARD_DATABASE_URL. Required for install and upgrade.
  databaseSecretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

frontend:
  image:
    repository: idea-board-frontend
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
