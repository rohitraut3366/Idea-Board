apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: {{ include "idea-board-postgres.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "idea-board-postgres.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "idea-board-postgres.name" . }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.username | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: POSTGRES_PASSWORD
              {{- else }}
              value: {{ required "postgres.password is required when PostgreSQL is enabled" .Values.password | quote }}
              {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.username | quote }}
                - -d
                - {{ .Values.database | quote }}
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "idea-board-postgres.name" . }}-data
  strategy:
    type: Recreate
