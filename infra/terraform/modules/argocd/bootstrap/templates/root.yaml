apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idea-board
  namespace: {{ .Release.Namespace }}
spec:
  project: idea-board
  source:
    repoURL: {{ .Values.repositoryURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/applications
    helm:
      valueFiles:
        - values-{{ .Values.cloud }}.yaml
      valuesObject:
        repositoryURL: {{ .Values.repositoryURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        cloud: {{ .Values.cloud | quote }}
        clusterName: {{ .Values.clusterName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
