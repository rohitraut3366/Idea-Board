traefik:
  fullnameOverride: ingress-controller
  ingressClass:
    name: traefik
    isDefaultClass: false
  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      publishedService:
        enabled: false
  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 30080
    websecure:
      expose:
        default: false
