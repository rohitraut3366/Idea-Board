name: idea-board-backend

include:
  - apps/backend/compose.yaml

services:
  frontend:
    image: idea-board-frontend:local
    build: ./apps/frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
