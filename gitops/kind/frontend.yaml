apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: idea-board
  source:
    repoURL: https://github.com/rohitraut3366/Idea-Board.git
    targetRevision: master
    path: charts/idea-board-frontend
    helm:
      releaseName: frontend
      skipTests: true
      valueFiles:
        - ../../gitops/kind/frontend-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: idea-board
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
