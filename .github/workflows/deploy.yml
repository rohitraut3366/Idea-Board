name: Deploy

on:
  workflow_dispatch:
    inputs:
      cloud:
        type: choice
        options: [aws, gcp]
        required: true
      environment:
        type: choice
        options: [staging, production, preview]
        required: true
      image_tag:
        description: Full commit SHA of images published by a successful CI run
        required: true
        type: string
      request:
        description: What does this environment need?
        default: Low traffic, keep resource use small
        type: string
      pr:
        description: PR number, only for previews
        default: 0
        type: number
      operation:
        type: choice
        options: [release, cleanup, rollback]
        default: release
      schema_compatible:
        description: For rollback, confirm the previous code supports the current database schema
        type: boolean
        default: false
  workflow_call:
    inputs:
      cloud:
        type: string
        required: true
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      request:
        type: string
        default: Disposable preview with low expected traffic
      pr:
        type: number
        default: 0
      operation:
        type: string
        default: release
      schema_compatible:
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  DEPLOY_CLOUD: ${{ inputs.cloud }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  PR_NUMBER: ${{ inputs.pr }}

jobs:
  plan:
    if: inputs.operation == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
      - run: uv sync --project tools/deploy --locked --no-dev
      - name: Check CI result and preview ownership
        working-directory: tools/deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os; from github import validate_release_provenance; validate_release_provenance(os.environ["GITHUB_REPOSITORY"], os.environ["IMAGE_TAG"], os.environ["DEPLOY_ENVIRONMENT"], int(os.environ["PR_NUMBER"]))'
      - name: Prepare the skill input
        env:
          DEPLOY_REQUEST: ${{ inputs.request }}
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py prompt --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" >deployment-prompt.md
      - name: Plan application and infrastructure sizing
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: deployment-prompt.md
          output-schema-file: .agents/skills/deploy/output.schema.json
          output-file: recommendation.json
          codex-version: '0.169.0'
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
      - name: Validate and render the release plan
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py prepare --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" --recommendation recommendation.json
      - name: Preserve the recommendation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-recommendation-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
          path: |
            recommendation.json
            release-plan/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: plan
    if: always() && (inputs.operation == 'cleanup' || inputs.operation == 'rollback' || needs.plan.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      evidence_available: ${{ steps.evidence.outputs.available }}
    concurrency:
      group: deploy-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
      cancel-in-progress: false
    environment: ${{ inputs.cloud }}-${{ inputs.environment == 'preview' && 'staging' || inputs.environment }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: inputs.operation == 'release'
        with:
          name: deployment-recommendation-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.node-version
          package-manager-cache: false
      - name: Install deployment dependencies
        run: uv sync --project tools/deploy --locked --no-dev
      - name: Validate the recommendation before cloud authentication
        if: inputs.operation == 'release'
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py render --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" --recommendation recommendation.json >applications.json
      - name: Recheck preview state before release
        if: inputs.environment == 'preview' && inputs.operation == 'release'
        working-directory: tools/deploy
        run: |
          python -c 'import os; from github import validate_release_provenance; validate_release_provenance(os.environ["GITHUB_REPOSITORY"], os.environ["IMAGE_TAG"], os.environ["DEPLOY_ENVIRONMENT"], int(os.environ["PR_NUMBER"]))'
      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.CLOUD_REGION }}
      - name: Connect to EKS
        if: inputs.cloud == 'aws'
        env:
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --alias idea-board-deploy
      - name: Authenticate to GCP
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: inputs.cloud == 'gcp'
      - name: Connect to GKE
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ vars.CLUSTER_NAME }}
          location: ${{ vars.CLOUD_REGION }}
          context_name: idea-board-deploy
      - name: Deploy and verify
        if: inputs.operation == 'release'
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py release --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" --recommendation recommendation.json --context idea-board-deploy
      - name: Restore the previous verified release
        if: inputs.operation == 'rollback'
        env:
          SCHEMA_COMPATIBLE: ${{ inputs.schema_compatible }}
        run: |
          if [[ "$SCHEMA_COMPATIBLE" != true ]]; then
            echo 'Confirm database schema compatibility before rollback.' >&2
            exit 1
          fi
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py rollback --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" --context idea-board-deploy --schema-compatible
      - name: Delete a closed PR preview
        if: inputs.operation == 'cleanup'
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/deploy.py cleanup --cloud "$DEPLOY_CLOUD" --environment "$DEPLOY_ENVIRONMENT" --image-tag "$IMAGE_TAG" --revision "$IMAGE_TAG" --pr "$PR_NUMBER" --context idea-board-deploy
      - name: Check for rollout evidence
        id: evidence
        if: always()
        run: |
          if [[ -f deployment-diagnostics.json ]]; then
            echo 'available=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Save release results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-result-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
          path: |
            deployment-result.json
            deployment-diagnostics.json
            applications.json
          if-no-files-found: ignore
          retention-days: 7

  diagnose:
    needs: deploy
    if: always() && needs.deploy.outputs.evidence_available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.7'
      - run: uv sync --project tools/deploy --locked --no-dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: deployment-result-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
      - name: Prepare evidence for diagnosis
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/analyze.py prompt --evidence deployment-diagnostics.json >diagnosis-prompt.md
      - name: Diagnose rollout evidence
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: diagnosis-prompt.md
          output-schema-file: .agents/skills/deploy/diagnosis.schema.json
          output-file: diagnosis.json
          codex-version: '0.169.0'
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
      - name: Validate the diagnosis
        run: |
          uv run --project tools/deploy --no-sync python tools/deploy/analyze.py report --evidence deployment-diagnostics.json --diagnosis diagnosis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollout-diagnosis-${{ inputs.cloud }}-${{ inputs.environment }}-${{ inputs.pr }}
          path: |
            diagnosis.json
            diagnosis.md
          if-no-files-found: error
          retention-days: 7
