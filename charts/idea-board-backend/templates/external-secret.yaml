{{- if .Values.externalSecret.enabled }}
{{- if .Values.postgres.enabled }}
{{- fail "externalSecret and bundled postgres cannot both be enabled" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    {{- toYaml (required "externalSecret.provider is required" .Values.externalSecret.provider) | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}-database
  target:
    name: {{ include "idea-board-backend.databaseSecretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- $credentials := "{{ .username | urlquery | replace \"+\" \"%20\" }}:{{ .password | urlquery | replace \"+\" \"%20\" }}" }}
        IDEA_BOARD_DATABASE_URL: {{ printf "postgresql+psycopg://%s@%s:%v/%s?sslmode=require" $credentials (required "externalSecret.host is required" .Values.externalSecret.host) .Values.externalSecret.port (required "externalSecret.database is required" .Values.externalSecret.database | urlquery | replace "+" "%20") | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: password
{{- end }}
