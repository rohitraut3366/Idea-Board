{{- range $name, $application := .Values.applications }}
{{- if $application.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: idea-board-local
  source:
    repoURL: {{ $.Values.repositoryURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: {{ $application.path | quote }}
    helm:
      releaseName: {{ $name }}
      skipTests: true
      skipCrds: true
      {{- with $application.valueFiles }}
      valueFiles:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      valuesObject:
        repositoryURL: {{ $.Values.repositoryURL | quote }}
        targetRevision: {{ $.Values.targetRevision | quote }}
        imageTag: {{ $.Values.imageTag | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $application.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
{{- end }}
