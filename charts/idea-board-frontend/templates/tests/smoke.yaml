apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  labels:
    {{- include "idea-board-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Skip
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [sh, -ec]
      args:
        - |
          wget -qO- "http://${FRONTEND_SERVICE}/" | grep -q '<div id="root">'
          wget -qO- "http://${FRONTEND_SERVICE}/api/ideas?limit=1"
          echo 'Frontend and API proxy passed'
      env:
        - name: FRONTEND_SERVICE
          value: {{ .Release.Name | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
