apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idea-board
  namespace: {{ .Release.Namespace }}
spec:
  description: Cluster services and Idea Board managed through the shared root.
  sourceRepos:
    - {{ .Values.repositoryURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Release.Namespace }}
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: ingress-system
    - server: https://kubernetes.default.svc
      namespace: idea-board
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.clusterName | quote }}
  clusterResourceWhitelist:
    - group: networking.k8s.io
      kind: IngressClass
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: cloud.google.com
      kind: BackendConfig
    - group: batch
      kind: Job
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: argoproj.io
      kind: Application
