# Disposable PostgreSQL for chart tests. Data is lost when the pod is replaced.
apiVersion: v1
kind: Secret
metadata:
  name: idea-board-database
stringData:
  DATABASE_URL: postgresql+psycopg://idea_board:idea_board_local@postgres:5432/idea_board
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: POSTGRES_DB
              value: idea_board
            - name: POSTGRES_USER
              value: idea_board
            - name: POSTGRES_PASSWORD
              value: idea_board_local
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, idea_board, -d, idea_board]
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
