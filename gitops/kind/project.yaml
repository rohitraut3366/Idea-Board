apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idea-board
  namespace: argocd
spec:
  description: Idea Board services in the local kind cluster
  sourceRepos:
    - https://github.com/rohitraut3366/Idea-Board.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: idea-board
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: ""
      kind: Service
    - group: batch
      kind: Job
