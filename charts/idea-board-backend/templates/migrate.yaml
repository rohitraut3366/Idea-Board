apiVersion: batch/v1
kind: Job
metadata:
  {{- if or .Values.postgres.enabled .Values.externalSecret.enabled }}
  name: {{ .Release.Name | trunc 40 | trimSuffix "-" }}-migrate-{{ toJson .Values | sha256sum | trunc 8 }}
  {{- else }}
  name: {{ .Release.Name }}-migrate
  {{- end }}
  labels:
    {{- include "idea-board-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- if or .Values.postgres.enabled .Values.externalSecret.enabled }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    {{- else }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    {{- end }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "idea-board-backend.databaseSecretName" . | quote }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
