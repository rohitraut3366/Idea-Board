apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-core-services
  namespace: {{ .Release.Namespace }}
spec:
  project: cluster-core-services
  source:
    repoURL: {{ .Values.repositoryURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/cluster-core-services
    helm:
      valuesObject:
        repositoryURL: {{ .Values.repositoryURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        cloud: {{ .Values.cloud | quote }}
        clusterName: {{ .Values.clusterName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      selfHeal: true
